<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">



    <title>LifeLink | Login</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/theme-toggle.css?v=20260918">
</head>

<body>

    <div class="background-image">
        <img
            src="/images/lifelink-background.jpg"
            alt="LifeLink Background"
        >
    </div>

    <div class="site-wrapper">

        <!-- NAVIGATION BAR -->
        <header class="navbar">

            <a href="/" class="logo-link">
                <img
                    src="/images/hero.jpg"
                    alt="LifeLink Blood Logo"
                    class="logo-image"
                >

                <span class="logo-text">LifeLink</span>
            </a>

            <nav class="nav-menu">

                <a href="/" class="nav-link">
                    HOME
                </a>

                <a href="/#about" class="nav-link">
                    ABOUT
                </a>

                <a href="/#features" class="nav-link">
                    FEATURES
                </a>

                <a href="/#contact" class="nav-link">
                    CONTACT
                </a>

            </nav>

            <button
                class="theme-toggle"
                type="button"
                aria-label="Toggle theme"
            >
                <span></span>
            </button>

        </header>

        <!-- LOGIN FORM -->
        <main class="login-page">

            <section class="login-container">

                <div class="login-right">

                    <h1 class="login-title">Login</h1>


                    <p>Access your account to continue.</p>

                    <form
                        class="login-form"
                        action="/login"
                        method="post"
                    >

                        <!-- USERNAME -->
                        <div class="form-group">

                            <label for="username">
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                            >

                            <small
                                class="error-message"
                                id="username-error"
                            ></small>

                        </div>

                        <!-- PASSWORD -->
                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter your password"
                                >

                                <button
                                    type="button"
                                    id="toggle-password"
                                    class="toggle-password"
                                    aria-label="Show password"
                                >
                                    👁
                                </button>

                            </div>

                            <small
                                class="error-message"
                                id="password-error"
                            ></small>

                        </div>

                        <!-- REMEMBER ME + FORGOT PASSWORD -->
                        <div class="login-options">

                            <label>
                                <input
                                    type="checkbox"
                                    name="remember"
                                >
                                Remember me
                            </label>

                            <a href="#">
                                Forgot Password?
                            </a>

                        </div>

                        <!-- LOGIN BUTTON -->
                        <button
                            type="submit"
                            class="login-button"
                        >
                            ➜ &nbsp; LOGIN
                        </button>

                        <!-- DIVIDER -->
                        <div class="login-divider">

                            <span></span>

                            <b>or</b>

                            <span></span>

                        </div>

                        <!-- REGISTER -->
                        <div class="register-link">

                            <span>
                                👤 + &nbsp; Don't have an account?
                            </span>

                            <a href="/register">
                                Register here →
                            </a>

                        </div>

                        <!-- ADMIN LOGIN -->
                        <div class="admin-login-link">

                            <span>
                                🪪 + &nbsp; Are you an administrator?
                            </span>

                            <a href="/admin-login">
                                Admin Login →
                            </a>

                        </div>

                    </form>

                </div>

                <!-- RIGHT SIDE IMAGE -->
                <div class="login-content">

                    <img
                        src="/images/welcome.jpg"
                        alt="Welcome to LifeLink"
                        class="welcome-image"
                    >

                </div>

            </section>

        </main>

    </div>

    <script src="/js/login.js"></script>
    <script src="/js/theme.js"></script>

<script src="/js/theme-toggle.js?v=20260918"></script>
</body>

</html>
