<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LifeLink | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/register.css">

</head>

<body>

<div class="container-fluid register-page">

<div class="row">

<div class="col-lg-5 left-panel">

<i class="fa-solid fa-droplet brand-icon"></i>

<h1>LifeLink</h1>

<p>

Every Drop Counts.<br>

Every Donor Matters.

</p>

<img src="images/register.jpg" class="register-image">

</div>

<div class="col-lg-7">

<div class="register-card">

<h2>Create Donor Account</h2>

<p>Step 2 of 4</p>

<div class="progress mb-4">

<div class="progress-bar bg-danger" style="width:50%"></div>

</div>

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label>Email Address</label>

<input type="email" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Contact Number</label>

<input type="text" class="form-control">

</div>

<div class="col-12 mb-3">

<label>Home Address</label>

<textarea class="form-control" rows="4"></textarea>

</div>

<div class="col-md-6 mb-3">

<label>Blood Type</label>

<select class="form-select">

<option selected disabled>Select Blood Type</option>

<option>A+</option>

<option>A-</option>

<option>B+</option>

<option>B-</option>

<option>AB+</option>

<option>AB-</option>

<option>O+</option>

<option>O-</option>

</select>

</div>

</div>

<div class="d-flex justify-content-between">

<a href="register.html" class="btn btn-outline-secondary">

Previous

</a>

<button class="btn btn-danger">

Next

</button>

</div>

</form>

</div>

</div>

</div>

</div>

<script src="js/register-step2.js"></script>

</body>

</html>
